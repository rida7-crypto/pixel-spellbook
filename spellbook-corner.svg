<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
      .pixel { shape-rendering: crispEdges; }

      /* Whole book gently floats, tying into the app's floating-widget nature */
      @keyframes bookFloat {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50%      { transform: translateY(-6px) rotate(-1.5deg); }
      }
      #spellbook {
        animation: bookFloat 3.2s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }

      /* Soft magical glow pulsing behind the book */
      @keyframes glowPulse {
        0%, 100% { opacity: 0.3; transform: scale(0.92); }
        50%      { opacity: 0.6; transform: scale(1.1); }
      }
      .book-aura {
        animation: glowPulse 2.6s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }

      /* Glowing rune/star on the cover pulses and shifts hue slightly */
      @keyframes runeGlow {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50%      { opacity: 1; transform: scale(1.18); }
      }
      .rune {
        animation: runeGlow 1.8s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }

      /* Twinkling sparkles around the book */
      @keyframes twinkle {
        0%, 100% { opacity: 0; transform: scale(0.4); }
        50%      { opacity: 1; transform: scale(1); }
      }
      .sparkle { animation: twinkle 2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
      .sparkle:nth-of-type(1) { animation-delay: 0s; }
      .sparkle:nth-of-type(2) { animation-delay: 0.6s; }
      .sparkle:nth-of-type(3) { animation-delay: 1.2s; }
      .sparkle:nth-of-type(4) { animation-delay: 1.7s; }

      /* Pages subtly riffle as if turning */
      @keyframes pageRiffle {
        0%, 100% { transform: scaleX(1); }
        50%      { transform: scaleX(0.9); }
      }
      .pages { animation: pageRiffle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 50%; }
    </style>
  </defs>

  <g transform="translate(50, 40) scale(2.6)">

    <!-- Magical aura glow behind the book -->
    <circle class="book-aura" cx="30" cy="30" r="20" fill="#b892ff" filter="blur(4px)"/>

    <!-- Sparkles -->
    <rect class="pixel sparkle" x="4" y="6" width="2" height="2" fill="#ffe9a8"/>
    <rect class="pixel sparkle" x="52" y="10" width="2" height="2" fill="#ffe9a8"/>
    <rect class="pixel sparkle" x="6" y="46" width="2" height="2" fill="#ffe9a8"/>
    <rect class="pixel sparkle" x="50" y="44" width="2" height="2" fill="#ffe9a8"/>

    <g id="spellbook" class="pixel">
      <!-- Pages peeking from the right edge -->
      <g class="pages">
        <rect x="34" y="8" width="4" height="36" fill="#f3e6c8"/>
        <rect x="34" y="8" width="4" height="3" fill="#e6d3a3"/>
        <rect x="34" y="41" width="4" height="3" fill="#e6d3a3"/>
      </g>

      <!-- Book cover -->
      <rect x="10" y="6" width="26" height="38" rx="1" fill="#5b3b8c"/>
      <rect x="10" y="6" width="26" height="38" fill="none" stroke="#2f1f52" stroke-width="1"/>

      <!-- Cover highlight -->
      <rect x="12" y="8" width="4" height="34" fill="#7a58b3"/>

      <!-- Spine / gold trim -->
      <rect x="9" y="6" width="3" height="38" fill="#c9973b"/>
      <rect x="9" y="6" width="1" height="38" fill="#ffe9a8"/>

      <!-- Corner trim accents -->
      <rect x="10" y="6" width="26" height="2" fill="#c9973b"/>
      <rect x="10" y="42" width="26" height="2" fill="#c9973b"/>

      <!-- Glowing rune / star emblem -->
      <g class="rune">
        <rect x="21" y="19" width="4" height="4" fill="#ffe9a8"/>
        <rect x="19" y="21" width="2" height="2" fill="#ffd166"/>
        <rect x="25" y="21" width="2" height="2" fill="#ffd166"/>
        <rect x="21" y="17" width="2" height="2" fill="#ffd166"/>
        <rect x="21" y="25" width="2" height="2" fill="#ffd166"/>
        <rect x="22" y="20" width="2" height="2" fill="#ffffff"/>
      </g>
    </g>
  </g>
</svg>
