<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="256" height="256" shape-rendering="crispEdges">
  <!-- Transparent background -->
  <rect width="16" height="16" fill="transparent"/>
  
  <!-- Book shadow -->
  <rect x="4" y="3" width="10" height="12" fill="#121031" opacity="0.4"/>
  
  <!-- Book cover base (Dark Purple) -->
  <rect x="3" y="2" width="10" height="12" fill="#2E2870"/>
  
  <!-- Book cover highlight (Lighter Purple) -->
  <rect x="4" y="3" width="8" height="10" fill="#4A41A8"/>
  
  <!-- Pages edge -->
  <rect x="13" y="3" width="1" height="10" fill="#FAEEDA"/>
  
  <!-- Red Ribbon Bookmark -->
  <rect x="9" y="2" width="2" height="5" fill="#993556"/>
  <rect x="9" y="7" width="1" height="1" fill="#993556"/>
  <rect x="10" y="7" width="1" height="1" fill="#6E2039"/>
  
  <!-- Gold Corners -->
  <rect x="3" y="2" width="3" height="1" fill="#F2C94C"/>
  <rect x="3" y="3" width="1" height="2" fill="#F2C94C"/>
  <rect x="3" y="13" width="3" height="1" fill="#F2C94C"/>
  <rect x="3" y="11" width="1" height="2" fill="#F2C94C"/>
  <rect x="10" y="13" width="3" height="1" fill="#F2C94C"/>
  <rect x="12" y="11" width="1" height="2" fill="#F2C94C"/>
  <rect x="10" y="2" width="1" height="1" fill="#F2C94C"/>
  
  <!-- Center Gold Sparkle -->
  <rect x="7" y="7" width="1" height="1" fill="#FFF3B0"/>
  <rect x="8" y="6" width="1" height="1" fill="#F2C94C"/>
  <rect x="8" y="8" width="1" height="1" fill="#F2C94C"/>
  <rect x="9" y="7" width="1" height="1" fill="#F2C94C"/>
</svg>